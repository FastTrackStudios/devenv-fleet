name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: devenv (pins.json `devenv`)
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths \
            "github:NixOS/nixpkgs/$(jq -r .devenv.nixpkgs pins.json)#devenv")
          echo "$out/bin" >> "$GITHUB_PATH"
      - name: fleet-pins agrees with flake.lock
        run: scripts/fleet-pins .
      # rustc is pins.json's store path, the linker is mold.
      - name: smoke project
        run: tests/smoke/run.sh
